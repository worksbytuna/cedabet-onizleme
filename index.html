<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Cedabet — Tasarım Ön İzleme</title>
<style>
  :root {
    --bg-purple: #0d0416;
    --bg-green: #0a1208;
    --accent-purple: #a855f7;
    --accent-green: #a3e635;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg-purple);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    transition: background 0.4s ease;
  }
  body.theme-green { background: var(--bg-green); }

  .stage {
    max-width: 1440px;
    margin: 0 auto;
  }
  .shot { display: none; }
  .shot.active { display: block; }
  .shot img {
    display: block;
    width: 100%;
    height: auto;
  }
  @media (max-width: 768px) {
    .stage { max-width: 520px; }
  }

  .switcher {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    padding: 5px;
    border-radius: 999px;
    background: rgba(10, 10, 14, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
    z-index: 10;
  }
  .switcher button {
    appearance: none;
    border: none;
    cursor: pointer;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.75);
    background: transparent;
    padding: 10px 18px;
    min-height: 44px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.25s ease, color 0.25s ease;
  }
  .switcher button .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex: none;
  }
  .switcher button[data-theme="purple"] .dot { background: var(--accent-purple); }
  .switcher button[data-theme="green"] .dot { background: var(--accent-green); }
  .switcher button.active {
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
  }
  .switcher button:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  @media (max-width: 480px) {
    .switcher { bottom: 12px; }
    .switcher button { padding: 10px 14px; font-size: 13px; }
  }
</style>
</head>
<body class="theme-purple">
  <main class="stage">
    <picture class="shot active" id="shot-purple">
      <source media="(max-width: 768px)" srcset="assets/cedabet-purple-mobile.png" />
      <img src="assets/cedabet-purple.png" alt="Cedabet — mor tema ön izleme" decoding="async" />
    </picture>
    <picture class="shot" id="shot-green">
      <source media="(max-width: 768px)" srcset="assets/cedabet-green-mobile.png" />
      <img src="assets/cedabet-green.png" alt="Cedabet — yeşil tema ön izleme" decoding="async" loading="lazy" />
    </picture>
  </main>

  <nav class="switcher" aria-label="Tema seçimi">
    <button type="button" data-theme="purple" class="active" aria-pressed="true"><span class="dot"></span>Mor Tema</button>
    <button type="button" data-theme="green" aria-pressed="false"><span class="dot"></span>Yeşil Tema</button>
  </nav>

  <script>
    const buttons = document.querySelectorAll(".switcher button");
    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const theme = btn.dataset.theme;
        document.body.className = "theme-" + theme;
        document.getElementById("shot-purple").classList.toggle("active", theme === "purple");
        document.getElementById("shot-green").classList.toggle("active", theme === "green");
        buttons.forEach((b) => {
          const on = b === btn;
          b.classList.toggle("active", on);
          b.setAttribute("aria-pressed", on ? "true" : "false");
        });
        window.scrollTo({ top: 0 });
      });
    });
  </script>
</body>
</html>
