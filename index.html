<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Cedabet — Tasarım Ön İzleme</title>
<style>
  :root {
    --bg-green: #0a1208;
    --bg-purple: #0d0416;
    --accent-green: #a3e635;
    --accent-purple: #a855f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg-green);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    transition: background 0.4s ease;
  }
  body.theme-purple { background: var(--bg-purple); }

  /* Minimal tema şeridi: sitenin üzerine binmez, içerikle birlikte kayar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 6px 0;
  }
  .topbar button {
    appearance: none;
    border: none;
    background: transparent;
    cursor: pointer;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
  }
  .topbar .dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .topbar button[data-theme="green"] .dot { background: var(--accent-green); }
  .topbar button[data-theme="purple"] .dot { background: var(--accent-purple); }
  .topbar button.active .dot {
    transform: scale(1.2);
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9);
  }
  .topbar button:not(.active) .dot { opacity: 0.45; }
  .topbar button:hover .dot { opacity: 1; }
  .topbar button:focus-visible {
    outline: 2px solid rgba(255, 255, 255, 0.9);
    outline-offset: -6px;
  }

  .stage {
    max-width: 1440px;
    margin: 0 auto;
  }
  .shot { display: none; }
  .shot.active { display: block; }
  .shot img {
    display: block;
    width: 100%;
    height: auto;
  }
  @media (max-width: 768px) {
    .stage { max-width: 520px; }
  }
</style>
</head>
<body class="theme-green">
  <header class="topbar" aria-label="Tema seçimi">
    <button type="button" data-theme="green" class="active" aria-pressed="true" aria-label="Yeşil tema" title="Yeşil tema"><span class="dot"></span></button>
    <button type="button" data-theme="purple" aria-pressed="false" aria-label="Mor tema" title="Mor tema"><span class="dot"></span></button>
  </header>

  <main class="stage">
    <picture class="shot active" id="shot-green">
      <source media="(max-width: 768px)" srcset="assets/cedabet-green-mobile.png" />
      <img src="assets/cedabet-green.png" alt="Cedabet — yeşil tema ön izleme" decoding="async" />
    </picture>
    <picture class="shot" id="shot-purple">
      <source media="(max-width: 768px)" srcset="assets/cedabet-purple-mobile.png" />
      <img src="assets/cedabet-purple.png" alt="Cedabet — mor tema ön izleme" decoding="async" loading="lazy" />
    </picture>
  </main>

  <script>
    const buttons = document.querySelectorAll(".topbar button");
    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const theme = btn.dataset.theme;
        document.body.className = "theme-" + theme;
        document.getElementById("shot-green").classList.toggle("active", theme === "green");
        document.getElementById("shot-purple").classList.toggle("active", theme === "purple");
        buttons.forEach((b) => {
          const on = b === btn;
          b.classList.toggle("active", on);
          b.setAttribute("aria-pressed", on ? "true" : "false");
        });
        window.scrollTo({ top: 0 });
      });
    });
  </script>
</body>
</html>
